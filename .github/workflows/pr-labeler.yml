# Auto-label pull requests by changed paths.
# Edit the case patterns below to match your repo layout.
# SECURITY: uses pull_request_target. Never add a step that checks out or runs PR code here.
name: PR Labeler
on:
  pull_request_target:
    types: [opened, synchronize]
permissions:
  contents: read
  pull-requests: write
jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Label by path
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          files=$(gh pr view "$PR" -R "$REPO" --json files -q '.files[].path')
          labels=""
          for f in $files; do
            case "$f" in
              docs/*|*.md) labels="$labels,documentation" ;;
              .github/*) labels="$labels,ci" ;;
              test*/*|*_test.*|*.test.*) labels="$labels,tests" ;;
              *) labels="$labels,code" ;;
            esac
          done
          labels=$(echo "${labels#,}" | tr ',' '\n' | sort -u | paste -sd, -)
          if [ -n "$labels" ]; then
            gh pr edit "$PR" -R "$REPO" --add-label "$labels" || true
          fi
